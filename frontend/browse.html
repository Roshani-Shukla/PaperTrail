<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PaperTrail - Browse Papers</title>
    <meta name="description" content="Browse, search, and download research papers in Artificial Intelligence, Machine Learning, Computer Vision, and more on PaperTrail.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->
    <nav>
        <a href="index.html" class="logo">
            Paper<span>Trail</span>
        </a>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="browse.html" class="active">Browse Papers</a></li>
            <li><a href="upload.html">Upload Paper</a></li>
        </ul>
    </nav>


    <!-- ================= PAGE HEADER ================= -->
    <section class="page-header">
        <h1>Browse Research Papers</h1>
        <p>Explore, search, and download verified research papers across diverse technical disciplines.</p>
    </section>


    <!-- ================= CONTENT ================= -->
    <section class="content">

        <!-- SEARCH INPUT -->
        <input
            type="text"
            id="searchInput"
            class="search"
            placeholder="Search by title, author, keyword, or category..."
            aria-label="Search research papers"
        >

        <!-- FILTERS -->
        <div class="filters">
            <select id="categoryFilter" aria-label="Filter by category">
                <option value="all">All Categories</option>
                <option value="Artificial Intelligence">Artificial Intelligence</option>
                <option value="Machine Learning">Machine Learning</option>
                <option value="Deep Learning">Deep Learning</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Natural Language Processing">Natural Language Processing</option>
                <option value="Computer Vision">Computer Vision</option>
                <option value="Data Science">Data Science</option>
                <option value="Networking">Networking</option>
            </select>

            <select id="yearFilter" aria-label="Filter by publication year">
                <option value="all">All Years</option>
            </select>

            <button type="button" class="reset-btn" onclick="resetFilters()">Reset Filters</button>
        </div>

        <!-- PAPERS GRID -->
        <div class="papers" id="papers">
            <!-- Dynamic content injected by script.js -->
        </div>

    </section>


    <!-- ================= FOOTER ================= -->
    <footer>
        <p>&copy; 2026 PaperTrail | Research Paper Repository</p>
    </footer>


    <!-- ================= JAVASCRIPT ================= -->
    <script src="script.js"></script>

</body>

</html>

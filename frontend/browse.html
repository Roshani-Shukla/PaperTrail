
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PaperTrail - Browse Papers</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav>

        <div class="logo">
            Paper<span>Trail</span>
        </div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="browse.html">Browse Papers</a></li>
            
            <li><a href="upload.html">Upload Paper</a></li>
        </ul>

    </nav>


    <!-- ================= PAGE HEADER ================= -->

    <section class="page-header">

        <h1>Browse Research Papers</h1>

        <p>
            Explore research papers from different technical fields.
        </p>

    </section>


    <!-- ================= CONTENT ================= -->

    <section class="content">

        <!-- SEARCH -->

        <input
            type="text"
            id="searchInput"
            class="search"
            placeholder="Search by title, author or category..."
            onkeyup="filterPapers()"
        >


        <!-- FILTERS -->

        <div class="filters">

            <select id="categoryFilter" onchange="filterPapers()">

                <option value="all">All Categories</option>

                <option value="Artificial Intelligence">AI</option>
<option value="Machine Learning">ML</option>

               <option value="Natural Language Processing">NLP</option>
                <option value="Computer Vision">
                    Computer Vision
                </option>

                <option value="Data Science">
                    Data Science
                </option>
                <option value="Networking">Networking</option>

            </select>


            <select id="yearFilter" onchange="filterPapers()">

                <option value="all">All Years</option>

                <option value="2020">2020</option>
                <option value="2018">2018</option>
                <option value="2017">2017</option>
                <option value="2016">2016</option>
                <option value="2015">2015</option>
                <option value="2014">2014</option>
                <option value="2013">2013</option>
                <option value="2012">2012</option>

            </select>

        </div>


        <!-- ================= PAPERS ================= -->

        <div class="papers" id="papers">


            

                
        </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 PaperTrail | Research Paper Repository
        </p>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>
    

</body>

</html>


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PaperTrail - Upload Paper</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>

        <div class="logo">
            Paper<span>Trail</span>
        </div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="browse.html">Browse Papers</a></li>
            <li><a href="categories.html">Categories</a></li>
            <li><a href="upload.html">Upload Paper</a></li>
        </ul>

    </nav>


    <section class="page-header">

        <h1>Upload Research Paper</h1>

        <p>
            Submit your research paper to PaperTrail.
        </p>

    </section>


    <section class="form-area">

        <div class="form-box">

            <form onsubmit="uploadPaper(event)">


                <div class="form-group">

                    <label for="title">
                        Paper Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="Enter research paper title"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="authors">
                        Authors
                    </label>

                    <input
                        type="text"
                        id="authors"
                        placeholder="Enter author names"
                        required
                    >

                    <small>
                        Enter multiple authors separated by commas.
                    </small>

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="AI & ML">
                            AI & ML
                        </option>

                        <option value="NLP">
                            Natural Language Processing
                        </option>

                        <option value="Computer Vision">
                            Computer Vision
                        </option>

                        <option value="Data Science">
                            Data Science
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="year">
                        Publication Year
                    </label>

                    <input
                        type="number"
                        id="year"
                        placeholder="Example: 2026"
                        min="1900"
                        max="2026"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="abstract">
                        Abstract
                    </label>

                    <textarea
                        id="abstract"
                        placeholder="Enter a short description of the research paper"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="paperFile">
                        Research Paper File
                    </label>

                    <input
                        type="file"
                        id="paperFile"
                        accept=".pdf"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="submit-btn"
                >
                    Submit Paper
                </button>


            </form>

        </div>

    </section>


    <footer>

        <p>
            © 2026 PaperTrail | Research Paper Repository
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
